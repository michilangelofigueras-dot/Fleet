<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1c33" />
  <title>FleetFlow — Vehicle Rental Management System</title>
  <meta name="description" content="Vehicle rental management: fleet, customers, bookings, charges and reports." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%232563eb'/><path d='M5.5 15.2v-2.4l1.2-3A1.9 1.9 0 0 1 8.4 8.7h7.2a1.9 1.9 0 0 1 1.7 1.1l1.2 3v2.4' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/><path d='M5.5 12.8h13' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/><circle cx='8.4' cy='15.8' r='1.4' fill='%23fff'/><circle cx='15.6' cy='15.8' r='1.4' fill='%23fff'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Logo & interface icons: real SVG artwork, referenced through <use> -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="6" fill="currentColor" stroke="none" />
      <path d="M5.5 15.2v-2.4l1.2-3A1.9 1.9 0 0 1 8.4 8.7h7.2a1.9 1.9 0 0 1 1.7 1.1l1.2 3v2.4" stroke="#fff" />
      <path d="M5.5 12.8h13" stroke="#fff" />
      <circle cx="8.4" cy="15.8" r="1.4" stroke="#fff" />
      <circle cx="15.6" cy="15.8" r="1.4" stroke="#fff" />
    </symbol>
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 16.5V12l1.8-4.5A2 2 0 0 1 7.7 6h8.6a2 2 0 0 1 1.9 1.5L20 12v4.5"/><path d="M4 12h16"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.5 5.6a3.4 3.4 0 0 1 0 6.8"/><path d="M17.4 14.6A6.2 6.2 0 0 1 21.2 20"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="14" r="4"/><path d="M11 11l9-9"/><path d="M17 5l2.5 2.5"/><path d="M14.5 7.5L17 10"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M2.5 20.5h19"/><path d="M6 20.5V12"/><path d="M11 20.5V5"/><path d="M16 20.5v-6"/><path d="M21 20.5V9"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.5a3 3 0 0 0-3-1.5c-1.7 0-3 .9-3 2s1.3 2 3 2 3 .9 3 2-1.3 2-3 2a3 3 0 0 1-3-1.5"/><path d="M12 6.5v11"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></symbol>
    <symbol id="i-trending" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.8-3.8"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24"><use href="#i-logo"></use></svg></span>
        <div class="brand-text">
          <p class="brand-name">FleetFlow</p>
          <p class="brand-sub">Vehicle Rental Management</p>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-foot">
        <p class="sidebar-foot-note">Records are stored on the server by index.php</p>
        <button type="button" class="btn ghost inverse sm" data-action="reset-data">
          <svg class="ico"><use href="#i-refresh"></use></svg> Reset demo data
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-button" id="menu-button" data-action="toggle-menu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg class="ico"><use href="#i-menu"></use></svg>
        </button>
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub">Fleet, rental and revenue overview</p>
        </div>
        <p class="today" id="today-chip"></p>
      </header>

      <main class="view" id="view"></main>
    </div>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toasts" id="toasts"></div>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
